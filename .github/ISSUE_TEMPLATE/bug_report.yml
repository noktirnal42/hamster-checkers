name: Bug Report
description: Report a crash, rules issue, display problem, or unexpected behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone
        - iPad
        - Mac
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version and build
      placeholder: "Example: 1.0.0 (3)"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app\n2. Choose 1P vs AI\n3. Move from..."
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recordings
      description: Drag in screenshots or a short screen recording if it helps.
